<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { background: #ffffff; font-family: 'Inter', sans-serif; color: #1a1a1a; padding-bottom: 260px; width: 100%; overflow-x: hidden; }
    #auth-screen { display: flex; }
    #main-app { display: none; }
    .top-nav { border-bottom: 1px solid #f0f0f0; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; z-index: 50; }
    .nav-tab { padding-bottom: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; color: #a3a3a3; border-bottom: 3px solid transparent; cursor: pointer; }
    .nav-tab.active { color: #000; border-bottom-color: #2563eb; }
    .slot-card { border-radius: 8px; padding: 12px 8px; border: 1px solid #d1d5db; cursor: pointer; text-align: center; transition: all 0.2s; }
    .state-available { background: #e5e7eb; color: #000; }
    .state-booked { background: #22c55e; color: #fff; font-weight: 900; }
    .state-blocked { background: #ef4444; color: #fff; font-weight: 900; }
    .is-draft { border: 3px dashed #2563eb !important; background: #eff6ff; color: #2563eb; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 24px; padding: 32px; }
    #syncBtn { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

  <div id="auth-screen" class="fixed inset-0 bg-slate-900 z-[1000] flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-sm text-center">
      <h1 class="text-white italic font-900 uppercase tracking-tighter text-3xl mb-2">Coldvert Secure</h1>
      <p class="text-slate-400 text-[10px] uppercase font-bold tracking-[0.3em] mb-12">Clinic Command Center</p>
      <input type="password" id="pinInput" placeholder="ENTER PIN" class="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl p-5 text-center text-white font-black text-2xl tracking-[0.5em] focus:border-blue-500 outline-none mb-4">
      <button onclick="checkPin()" id="loginBtn" class="w-full bg-blue-600 text-white font-900 py-5 rounded-2xl uppercase tracking-widest text-sm shadow-2xl hover:bg-blue-500 transition-all">Unlock Dashboard</button>
      <p id="errorMsg" class="text-red-500 text-[10px] font-bold uppercase mt-4 hidden">Invalid PIN</p>
    </div>
  </div>

  <div id="main-app">
    <button id="syncBtn" onclick="applySchedulerChanges()" class="hidden bg-blue-600 text-white font-900 px-12 py-5 rounded-full uppercase tracking-widest text-sm shadow-2xl">
      <span id="syncText">💾 Sync Changes to Excel</span>
    </button>

    <nav class="top-nav">
      <div class="flex items-center gap-8">
        <h1 class="italic font-900 uppercase tracking-tighter">Clinic Command</h1>
        <div class="flex gap-6">
          <button onclick="switchView('ledger')" id="tab-ledger" class="nav-tab active">Ledger</button>
          <button onclick="switchView('schedule')" id="tab-schedule" class="nav-tab">Slots</button>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button id="bulkCopyBtn" onclick="openCopyModal()" class="hidden bg-black text-white px-4 py-2 rounded-lg font-900 text-[10px] uppercase">📋 Bulk Copy</button>
        <input type="text" id="searchInput" onkeyup="filterList()" placeholder="Search..." class="border rounded-lg px-3 py-1.5 text-xs w-40 outline-none">
      </div>
    </nav>

    <div id="view-ledger" class="w-full px-10 py-6">
      <div id="ledger-grid" class="space-y-2"></div>
    </div>

    <div id="view-schedule" class="hidden w-full px-10 py-6">
       <div class="mb-8 bg-gray-50 p-4 rounded-xl border flex justify-between items-center">
         <select id="monthSelect" onchange="filterSchedule()" class="border-2 border-black p-3 rounded-xl font-900 uppercase text-xs">
           <option value="0">January</option><option value="1">February</option><option value="2" selected>March</option>
           <option value="3">April</option><option value="4">May</option><option value="5">June</option>
           <option value="6">July</option><option value="7">August</option><option value="8">September</option>
           <option value="9">October</option><option value="10">November</option><option value="11">December</option>
         </select>
       </div>
       <div id="schedule-content" class="grid grid-cols-1 md:grid-cols-4 gap-8"></div>
    </div>
  </div>

  <script>
    // --- EXTERNAL CONNECTION SETTINGS ---
    const API_URL = "https://script.google.com/macros/s/AKfycby9fYfb0FRTT6ge_7Bn4mDuvzH-kW00iVkX25u6PfPGWKVEZlISvJjd-w9gu1VlZLV3jA/exec";

    let globalLedger = [], globalSchedule = [], scheduleUpdates = [], scheduleAdds = [], scheduleDeletes = [];
    const mNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    // 1. PIN CHECK (External Fetch)
    async function checkPin() {
      const pin = document.getElementById('pinInput').value;
      const btn = document.getElementById('loginBtn');
      btn.innerText = "VERIFYING...";
      
      try {
        const resp = await fetch(`${API_URL}?checkPin=${pin}`);
        const data = await resp.json();
        if(data.isValid) {
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('main-app').style.display = 'block';
          initApp();
        } else {
          document.getElementById('errorMsg').classList.remove('hidden');
          btn.innerText = "Unlock Dashboard";
        }
      } catch (e) { alert("Check Connection"); btn.innerText = "Unlock Dashboard"; }
    }

    // 2. DATA LOAD (External Fetch)
    async function initApp() {
      const resp = await fetch(`${API_URL}?fetch=true`);
      const data = await resp.json();
      
      globalLedger = data.appointments;
      globalSchedule = data.slots;
      
      renderLedger();
      filterSchedule();
    }

    function renderLedger() {
      document.getElementById('ledger-grid').innerHTML = globalLedger.map(item => `
        <div class="flex justify-between items-center p-4 border rounded-xl">
          <div><p class="font-bold text-sm uppercase">${item.Name}</p><p class="text-[10px] text-gray-400">${item['Appt Date']} @ ${item['Appt Time']}</p></div>
          <p class="text-[10px] font-bold text-blue-600 uppercase">${item.Description || 'General'}</p>
        </div>`).join('');
    }

    function filterSchedule() {
      const mIdx = parseInt(document.getElementById('monthSelect').value);
      const days = new Date(2026, mIdx + 1, 0).getDate();
      let html = '';
      for (let d = 1; d <= days; d++) {
        const dStr = `${d} ${mNames[mIdx]} 2026`;
        const slots = globalSchedule.filter(s => s.date === dStr);
        html += `<div class="border p-4 rounded-2xl">
          <p class="text-[10px] font-black border-b pb-2 mb-4 uppercase">${dStr}</p>
          <div class="grid grid-cols-2 gap-2">
            ${slots.map(s => `<div class="slot-card state-available text-[9px] font-bold">${s.time}</div>`).join('')}
          </div>
        </div>`;
      }
      document.getElementById('schedule-content').innerHTML = html;
    }

    function switchView(v) {
      document.getElementById('view-ledger').classList.toggle('hidden', v !== 'ledger');
      document.getElementById('view-schedule').classList.toggle('hidden', v !== 'schedule');
      document.getElementById('tab-ledger').classList.toggle('active', v === 'ledger');
      document.getElementById('tab-schedule').classList.toggle('active', v === 'schedule');
    }

    // 3. SYNC ENGINE (External POST)
    async function applySchedulerChanges() {
      const payload = { updates: scheduleUpdates, adds: scheduleAdds, slotDeletes: scheduleDeletes };
      await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      location.reload();
    }
  </script>
</body>
</html>
